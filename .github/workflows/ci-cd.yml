name: EpsInc CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: epsinc

jobs:
  test:
    name: Pruebas del servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pip install -r serverless/requirements.txt
      - run: python -m pip install -r loadtest/requirements.txt
      - run: python run_tests.py
      - run: python -m unittest serverless.test_leaderboard
      - run: python -m unittest loadtest.test_locustfile

  aws-ready:
    name: Comprobar configuración AWS
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -n "$AWS_ROLE_ARN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN aún no está configurado; despliegue queda en espera de Terraform."
          fi

  build:
    name: Crear y publicar imagen
    needs: [test, aws-ready]
    if: github.event_name != 'pull_request' && needs.aws-ready.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.registry.outputs.registry }}/epsinc/server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: registry
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.registry }}/epsinc/server:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./loadtest
          file: ./loadtest/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.registry }}/epsinc/server:loadtest-${{ github.sha }}

  deploy:
    name: Actualizar Agones en EKS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Configure EKS access
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"
      - name: Install Agones and monitoring
        run: |
          helm repo add agones https://agones.dev/chart/stable
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update
          helm upgrade --install agones agones/agones --version 1.60.0 --server-side=false --set agones.controller.persistentLogsSizeLimitMB=512 --set agones.extensions.persistentLogsSizeLimitMB=512 --set agones.ping.install=false --set agones.allocator.service.serviceType=ClusterIP --namespace agones-system --create-namespace --wait
          helm upgrade --install epsinc-monitoring prometheus-community/kube-prometheus-stack --version 92.21.2 -f grafana/helm-values.yaml --namespace monitoring --create-namespace --wait
          helm upgrade agones agones/agones --version 1.60.0 --server-side=false --reuse-values --set agones.metrics.serviceMonitor.enabled=true --set agones.metrics.serviceMonitor.additionalLabels.release=epsinc-monitoring --namespace agones-system --wait
          aws_account_id=$(aws sts get-caller-identity --query Account --output text)
          sed "s|__AWS_ACCOUNT_ID__|$aws_account_id|g" k8s/cluster_autoscaler_service_account.yaml | kubectl apply -f -
          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler --version 9.51.0 --namespace kube-system --set cloudProvider=aws --set awsRegion="$AWS_REGION" --set autoDiscovery.clusterName="$EKS_CLUSTER" --set image.tag=v1.34.6 --set rbac.serviceAccount.create=false --set rbac.serviceAccount.name=cluster-autoscaler --wait
          kubectl create configmap epsinc-dashboard --namespace monitoring --from-file=epsinc_dashboard.json=grafana/epsinc_dashboard.json --dry-run=client -o yaml | kubectl apply -f -
          kubectl label configmap epsinc-dashboard grafana_dashboard=1 --namespace monitoring --overwrite
      - name: Publish image to fleet
        env:
          IMAGE_URI: ${{ needs.build.outputs.image }}
        run: |
          sed -i "s|__EPSINC_IMAGE__|$IMAGE_URI|g" k8s/fleet.yaml
          kubectl apply -f k8s/
          kubectl wait --for=jsonpath='{.status.readyReplicas}'=3 fleet/epsinc-fleet --timeout=180s
