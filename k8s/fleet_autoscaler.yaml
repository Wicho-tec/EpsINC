apiVersion: "autoscaling.agones.dev/v1"
kind: FleetAutoscaler
metadata:
  name: epsinc-fleet-autoscaler
  namespace: default
  labels:
    app: epsinc
spec:
  fleetName: epsinc-fleet
  policy:
    type: Buffer
    buffer:
      bufferSize: 3           # Maintains 3 Ready standby game servers at all times
      minReplicas: 3          # Baseline standby during idle hours
      maxReplicas: 50         # Supports up to 1,000 concurrent players (50 servers * 20 players)
  sync:
    type: FixedInterval
    fixedInterval:
      seconds: 3              # Fast 3-second evaluation loop for rapid spike reaction
