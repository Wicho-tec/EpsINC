apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: epsinc-pod-monitor
  namespace: default
  labels:
    app: epsinc
    release: epsinc-monitoring
spec:
  selector:
    matchLabels:
      agones.dev/role: gameserver
  podMetricsEndpoints:
    - port: default
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
