apiVersion: v1
kind: Service
metadata:
  name: epsinc-locust-master
  namespace: default
spec:
  selector:
    app: epsinc-locust
    role: master
  ports:
    - name: master
      port: 5557
      targetPort: 5557
    - name: events
      port: 5558
      targetPort: 5558
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsinc-locust-workers
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: epsinc-locust
      role: worker
  template:
    metadata:
      labels:
        app: epsinc-locust
        role: worker
    spec:
      containers:
        - name: locust
          image: __LOCUST_IMAGE__
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --worker
            - --master-host
            - epsinc-locust-master
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
              readOnly: true
      volumes:
        - name: locustfile
          configMap:
            name: epsinc-locust
