service: epsinc-leaderboard

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  memorySize: 256
  timeout: 5
  environment:
    STAGE: ${self:provider.stage}

functions:
  leaderboardApi:
    handler: leaderboard_function.handler
    events:
      - http:
          path: leaderboard/top
          method: get
          cors: true
      - http:
          path: leaderboard/submit
          method: post
          cors: true
      - schedule:
          rate: rate(7 days)
          description: "Reinicio semanal de tabla de líderes competitivos"
